<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Fiverr performance snapshot</title>
  <desc id="desc">2054 completed Fiverr orders, 929 client reviews, 100 percent on-time delivery, 4.9 overall rating and 35 percent global reach.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101d31"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1597f2"/>
      <stop offset="1" stop-color="#62b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000814" flood-opacity=".3"/>
    </filter>
  </defs>

  <rect width="1200" height="560" rx="34" fill="url(#panel)"/>
  <rect x="1" y="1" width="1198" height="558" rx="33" fill="none" stroke="#23324a" stroke-width="2"/>

  <text x="60" y="74" fill="#62b8ff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FIVERR PERFORMANCE</text>
  <text x="60" y="122" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Built on consistency and client trust.</text>

  <g filter="url(#shadow)">
    <rect x="60" y="168" width="252" height="134" rx="22" fill="#111d30" stroke="#263751"/>
    <rect x="330" y="168" width="252" height="134" rx="22" fill="#111d30" stroke="#263751"/>
  </g>
  <text x="86" y="228" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">2,054</text>
  <text x="86" y="266" fill="#9aabc1" font-family="Arial, Helvetica, sans-serif" font-size="17">Orders completed</text>
  <text x="356" y="228" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">929</text>
  <text x="356" y="266" fill="#9aabc1" font-family="Arial, Helvetica, sans-serif" font-size="17">Client reviews</text>

  <text x="60" y="356" fill="#dce7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">On-time delivery</text>
  <text x="582" y="356" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">100%</text>
  <rect x="60" y="374" width="522" height="14" rx="7" fill="#1d2b41"/>
  <rect x="60" y="374" width="522" height="14" rx="7" fill="url(#blue)"/>

  <text x="60" y="438" fill="#dce7f5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Overall rating</text>
  <text x="582" y="438" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">4.9 / 5</text>
  <rect x="60" y="456" width="522" height="14" rx="7" fill="#1d2b41"/>
  <rect x="60" y="456" width="512" height="14" rx="7" fill="url(#blue)"/>

  <circle cx="880" cy="325" r="128" fill="none" stroke="#1d2b41" stroke-width="34"/>
  <circle cx="880" cy="325" r="128" fill="none" stroke="#1597f2" stroke-width="34" stroke-linecap="round" stroke-dasharray="281.5 804.2" transform="rotate(-90 880 325)"/>
  <text x="880" y="319" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" text-anchor="middle">35%</text>
  <text x="880" y="354" fill="#9aabc1" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle">global reach</text>

  <circle cx="1080" cy="80" r="27" fill="#1dbf73"/>
  <text x="1080" y="89" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">fi</text>
</svg>
